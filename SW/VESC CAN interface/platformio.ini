; PlatformIO Project Configuration File
;
; Target: ESP32-S3 N16R8 (16MB flash, 8MB octal PSRAM)
; Reads a centered linear potentiometer through an ADS1115 ADC and drives a
; VESC motor controller directly over CAN (TJA1051 transceiver) using the
; VESC CAN_PACKET_SET_RPM command; fuses an ICM20948 9-axis IMU (FSPI) for
; compass heading + fall detection; hosts a WiFi Access Point + web
; dashboard (LittleFS + ESPAsyncWebServer + WebSocket) for live telemetry,
; a CAN monitor, and calibrating/tuning everything.
;
;   https://docs.platformio.org/page/projectconf.html
;
; Web UI files live in data/ and are a SEPARATE upload from the firmware:
;   pio run --target uploadfs   (flashes data/ to the LittleFS partition)
;   pio run --target upload     (flashes the firmware itself, as usual)
; Do both after a fresh flash; only uploadfs is needed again if you change
; files under data/ without touching the C++ sources.

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 flash / PSRAM overrides -----------------------------------------
; N16R8 = 16MB flash, 8MB Octal ("Quad-I/O for flash, Octal-I/O for PSRAM")
; PSRAM. The generic esp32-s3-devkitc-1 board definition defaults to a
; smaller flash size, so these are overridden explicitly.
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
board_upload.flash_size = 16MB

; LittleFS filesystem for the web UI (data/) — default_16MB.csv gives the
; "spiffs" partition ~6.7MB, plenty for these few small files.
board_build.filesystem = littlefs

; Some espressif32 platform releases instead ship a board id that already
; encodes N16R8 (esp32-s3-devkitc-1-n16r8). If `pio run` complains that the
; board above does not exist, try that id instead and drop the overrides.

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -DASYNCWEBSERVER_REGEX=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

lib_compat_mode = strict
lib_ldf_mode = chain

; AsyncTCP/ESPAsyncWebServer EXACT-pinned (no ^ caret) to the same versions
; as a separately verified-working ICM20948+WebSocket+dashboard project on
; the same board. NOTE: a caret range like "^3.3.2" means ">=3.3.2 <4.0.0",
; NOT "exactly 3.3.2" — with a caret, PlatformIO's resolver still picks the
; newest release satisfying the range, which is how this ended up on
; 3.5.0/3.12.0 even after the first "pin" attempt. Exact (no-caret) version
; strings are the only way to actually reproduce the tested combination.
lib_deps =
    adafruit/Adafruit ADS1X15 @ ^2.5.0
    adafruit/Adafruit BusIO @ ^1.16.1
    sparkfun/SparkFun 9DoF IMU Breakout - ICM 20948 - Arduino Library @ ^1.3.1
    bblanchon/ArduinoJson @ ^7.2.0
    ESP32Async/AsyncTCP @ 3.3.2
    ESP32Async/ESPAsyncWebServer @ 3.6.0
