; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32-s3-n16r8]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; --- N16R8 specific overrides (16MB flash, 8MB Octal PSRAM) ---
board_build.flash_size = 16MB
board_build.psram_type = opi
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB

build_flags =
    -DBOARD_HAS_PSRAM
    ; Your board boots via USB_UART_CHIP_RESET and shows the ROM boot banner
    ; but nothing from the sketch -> it uses the ESP32-S3's native USB port
    ; for Serial (no separate CP2102/CH340 chip). These two flags route
    ; Arduino's Serial to that native USB-CDC port instead of the (unused)
    ; UART0 pins. If you ever swap to a board WITH a USB-UART bridge chip,
    ; comment these back out.
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder, colorize
monitor_rts = 0
monitor_dtr = 0

; If auto-detection of the upload/monitor COM port fails, uncomment and set it:
; upload_port = COM5
; monitor_port = COM5
